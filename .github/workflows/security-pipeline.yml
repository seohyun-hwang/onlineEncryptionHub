name: Security & Detection Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validation-pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: encryptdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: checkout (source code)
        uses: actions/checkout@v4

      - name: Set up JDK 24 (Project Panama & Vector API)
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: run all testcases
        env:
          MAVEN_OPTS: "--add-modules jdk.incubator.vector"
          GRPC_CLASSIFIER_HOST: localhost
          GRPC_CLASSIFIER_PORT: 50051
        run: mvn clean verify -DargLine="--add-modules jdk.incubator.vector"

      - name: verify Docker image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: online-encryption-hub:latest

  kubernetes-test:
    runs-on: ubuntu-latest
    needs: validation-pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Build Docker image inside Minikube
        run: |
          minikube image build -t online-encryption-hub:latest .

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Verify Pods spin up successfully
        run: |
          echo "Waiting for databases to be ready..."
          kubectl wait --for=condition=ready pod -l app=postgres --timeout=90s
          kubectl wait --for=condition=ready pod -l app=redis --timeout=60s
          echo "Waiting for application pods to be ready..."
          kubectl wait --for=condition=ready pod -l app=encryption-api --timeout=120s
          kubectl get pods -o wide