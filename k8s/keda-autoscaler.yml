apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: encryption-worker-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: encryption-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    # Trigger 1: Scale on Redis queue length
    - type: redis
      metadata:
        address: redis-service:6379
        listName: honeypot-queue
        listLength: "5"
    # Trigger 2: Scale on Kafka consumer group lag
    - type: kafka
      metadata:
        bootstrapServers: kafka-service:9092
        topic: honeypot-telemetry
        consumerGroup: honeypot-workers
        lagThreshold: "10"