apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: redis-queue-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: encryption-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 5
  triggers:
    - type: redis
      metadata:
        address: redis-service:6379
        listName: tasks:pending
        listLength: "5" # Scale up 1 worker for every 5 pending tasks in the queue