apiVersion: apps/v1
kind: Deployment
metadata:
  name: encryption-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: encryption-api
  template:
    metadata:
      labels:
        app: encryption-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;' ]
      containers:
        - name: api
          image: online-encryption-hub:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_MODE
              value: "api"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: GRPC_CLASSIFIER_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GRPC_CLASSIFIER_HOST
            - name: GRPC_CLASSIFIER_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GRPC_CLASSIFIER_PORT
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10