apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/encryptdb"
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  GRPC_CLASSIFIER_HOST: "localhost"
  GRPC_CLASSIFIER_PORT: "50051"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_PROPERTIES_HIBERNATE_SCHEMA_UPDATE_UNIQUE_CONSTRAINT_STRATEGY: "SKIP"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""