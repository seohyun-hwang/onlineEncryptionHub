apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/encryptdb"
  SPRING_DATASOURCE_USERNAME: "postgres"
  GRPC_CLASSIFIER_HOST: "localhost"
  GRPC_CLASSIFIER_PORT: "9090"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "pa"