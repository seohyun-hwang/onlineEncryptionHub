spring.application.name=encryptMsg
server.port=8080

# H2 Configuration (H2 is no longer used)
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:encryptdb
#spring.datasource.username=sa
#spring.datasource.password=

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/encryptdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LLM Settings
llm.api.key=ollama-local
llm.api.url=http://localhost:11434/v1/chat/completions
llm.model=llama3